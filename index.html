<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Learning Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --canvas: oklch(0.985 0.012 240);
    --surface: oklch(1 0 0);
    --ink: oklch(0.27 0.05 265);
    --ink-soft: oklch(0.48 0.04 265);
    --ink-faint: oklch(0.66 0.03 265);
    --primary: oklch(0.55 0.17 265);
    --primary-soft: oklch(0.93 0.05 265);
    --hairline: oklch(0.9 0.02 255);
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Hanken Grotesk', system-ui, sans-serif;
  }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #root { min-height: 100vh; }
  ::selection { background: var(--primary-soft); }
  button { font-family: inherit; cursor: pointer; }

  @keyframes floatUp {
    from { opacity: 0; transform: translateY(22px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes orbDrift {
    0%, 100% { transform: translate(0,0) scale(1); }
    33%  { transform: translate(8px,-10px) scale(1.04); }
    66%  { transform: translate(-7px,6px) scale(0.97); }
  }
  @keyframes orbHue {
    0%,100% { filter: hue-rotate(0deg); }
    50% { filter: hue-rotate(24deg); }
  }
  @keyframes blobMove {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px,-26px) scale(1.12); }
  }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes pulseRing {
    0% { transform: scale(0.8); opacity: 0.55; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  @keyframes barStripe { to { background-position: 32px 0; } }
  @keyframes pop {
    from { opacity:0; transform: translateY(10px) scale(0.98); }
    to { opacity:1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
